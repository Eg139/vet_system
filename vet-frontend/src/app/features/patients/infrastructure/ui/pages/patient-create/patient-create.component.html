<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow-md mt-6">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Registrar Nuevo Paciente</h2>

  <form [formGroup]="patientForm" (ngSubmit)="onSubmit()" class="space-y-4">
    
    <!-- Nombre del Paciente -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Nombre del Paciente</label>
      <input type="text" formControlName="name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
    </div>

    <!-- Especie y Raza -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Especie</label>
        <input type="text" formControlName="species" placeholder="Ej. Canino, Felino" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Raza</label>
        <input type="text" formControlName="breed" placeholder="Ej. Yorkshire Terrier" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>
    </div>

    <!-- Fecha de Nacimiento y Peso -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Fecha de Nacimiento</label>
        <input type="date" formControlName="birthDate" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Peso (kg)</label>
        <input type="number" step="0.1" formControlName="weightKg" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>
    </div>

    <!-- Datos del Propietario -->
    <div class="grid grid-cols-2 gap-4 border-t pt-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nombre del Propietario</label>
        <input type="text" formControlName="ownerName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Teléfono del Propietario</label>
        <input type="text" formControlName="ownerPhone" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>
    </div>

    <!-- Información médica básica -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Grupo Sanguíneo</label>
        <input type="text" formControlName="bloodType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>
      <div class="flex items-center mt-6">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" formControlName="isDonor" class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 h-4 w-4">
          <span class="ml-2 text-sm text-gray-700">¿Es Donante?</span>
        </label>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="flex justify-end space-x-4 pt-4">
      <button type="button" (click)="goBack()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">
        Cancelar
      </button>
      <button type="submit" [disabled]="patientForm.invalid" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50">
        Guardar Paciente
      </button>
    </div>

  </form>
</div>
