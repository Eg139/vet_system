<div class="max-w-4xl mx-auto p-6 space-y-6">
  
  <!-- BOTÓN DE RETORNO -->
  <div>
    <a [routerLink]="['/backoffice/patients/detail', patientId]" class="text-xs text-slate-400 hover:text-emerald-400 transition flex items-center gap-1 font-medium">
      ← Volver al perfil del paciente
    </a>
  </div>

  <!-- HEADER DE EDICIÓN -->
  <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
    <h1 class="text-xl font-bold text-slate-100 tracking-tight flex items-center gap-2">
      <span>✏️</span> Modificar Datos del Paciente
    </h1>
    <p class="text-xs text-slate-400 mt-1">
      Actualiza la información clínica y de contacto del paciente en el sistema.
    </p>

    <!-- FORMULARIO REACTIVO -->
    <form [formGroup]="patientForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Nombre -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nombre del Paciente *</label>
          <input type="text" formControlName="name" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Especie -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Especie *</label>
          <input type="text" formControlName="species" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Raza -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Raza *</label>
          <input type="text" formControlName="breed" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Fecha de Nacimiento -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Fecha de Nacimiento</label>
          <input type="date" formControlName="birthDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Peso Actual -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Peso (kg)</label>
          <input type="number" step="0.1" formControlName="weightKg" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Grupo Sanguíneo -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Grupo Sanguíneo</label>
          <input type="text" formControlName="bloodType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Tutor Responsable -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tutor Responsable *</label>
          <input type="text" formControlName="ownerName" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Teléfono del Tutor -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Teléfono de Contacto *</label>
          <input type="text" formControlName="ownerPhone" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-700">
        <a [routerLink]="['/backoffice/patients/detail', patientId]" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition">
          Cancelar
        </a>
        <button type="submit" [disabled]="isSubmitting" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg transition shadow-sm disabled:opacity-50">
          {{ isSubmitting ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>

    </form>

  </div>

</div>
